name = "orvi"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The Mini App itself (docs/) is served by the same Worker, so the app and
# its API share one origin.
[assets]
directory = "../docs"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "orvi"
database_id = "5645d88e-eb5a-43f2-80b2-4ba31310f263"

# Daily digests and due-date reminders are checked every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

[vars]
BOT_USERNAME = "orvi_task_bot"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   BOT_TOKEN       token from @BotFather
#   WEBHOOK_SECRET  any random string of letters, digits, _ and -

# Server logs on the Workers dashboard (Observability tab).
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
