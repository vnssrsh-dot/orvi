name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: Playwright 1.56 cannot install its browser on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - name: Logs on failure
        if: failure()
        run: tail -n 200 .tmp/worker.out || true
