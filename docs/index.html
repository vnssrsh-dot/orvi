<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>window.ORVI_APP=true</script>
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>orvi. прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Lora:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-sized Telegram Mini App frame centred on the page, Telegram bot preview beside it (below on phones). */
:root{
  --page:#DEDCE9; --bg:#EEEDF4; --card:#F8F7FB; --chip:#E5E4EE; --chip-2:#DCDAE7;
  --ink:#201F2C; --ink-2:#4F4D61; --muted:#8C8A9E; --line:#E0DEEA;
  --accent:#EA642B; --accent-ink:#FFFFFF; --accent-soft:#FBE4D8; --accent-text:#D2561F;
  --tile:#E9E8F0; --tile-peach:#FBE5DA; --tile-sage:#E3E8E3; --tile-lilac:#E6E1F5; --tile-steel:#DFE4EF; --tile-rose:#F5E0E6; --tile-sand:#F2E8D2;
  --dark:#24232F; --dark-2:#33324A; --on-dark:#F1EFF7; --on-dark-2:#A9A6BE;
  --shadow:0 1px 2px rgba(40,36,70,.05),0 6px 18px rgba(40,36,70,.05);
  --danger:#D4453C;
  /* status marks: fixed, same in every theme */
  --st-idea:#E3A13B; --st-todo:#8E89AA; --st-prog:#EA642B; --st-rev:#5E9C7B; --st-done:#EA642B;
  --f-display:"Lora",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mark:"Jost","Futura","Century Gothic",sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0E0D15; --bg:#17161F; --card:#211F2C; --chip:#2B2A39; --chip-2:#353446;
  --ink:#EEEDF5; --ink-2:#BDBACF; --muted:#8683A0; --line:#2E2D3D;
  --accent:#F0703A; --accent-soft:#3B2820; --accent-text:#FF9466;
  --tile:#2A2938; --tile-peach:#3A2A24; --tile-sage:#26302B; --tile-lilac:#2D2940; --tile-steel:#252B3A; --tile-rose:#3A2830; --tile-sand:#36301F;
  --dark:#0D0C14; --dark-2:#1F1E2C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0E0D15; --bg:#17161F; --card:#211F2C; --chip:#2B2A39; --chip-2:#353446;
  --ink:#EEEDF5; --ink-2:#BDBACF; --muted:#8683A0; --line:#2E2D3D;
  --accent:#F0703A; --accent-soft:#3B2820; --accent-text:#FF9466;
  --tile:#2A2938; --tile-peach:#3A2A24; --tile-sage:#26302B; --tile-lilac:#2D2940; --tile-steel:#252B3A; --tile-rose:#3A2830; --tile-sand:#36301F;
  --dark:#0D0C14; --dark-2:#1F1E2C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.2); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:14px;padding:24px 16px 40px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}
.i.fill{fill:currentColor;stroke:currentColor}

.pg-head{max-width:860px;margin:0 auto 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pg-head .wm{font-size:26px}
.pg-head p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.5;flex:1;min-width:220px}
.layout{max-width:860px;margin:0 auto;display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}

.phone{width:390px;max-width:100%;height:820px;border-radius:44px;background:var(--bg);box-shadow:0 30px 60px -20px rgba(40,36,80,.35),0 0 0 8px var(--card);overflow:hidden;display:flex;flex-direction:column;position:relative;flex:none}
.sbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 34px;font-weight:700;font-size:14px}
.sbar span{display:flex;gap:5px;align-items:center}
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* wordmark + logo */
.wm{font-family:var(--f-mark);font-weight:300;letter-spacing:.01em;line-height:1}
.wm b{color:var(--accent);font-weight:400}

/* top bars */
.top{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 18px;flex:none;min-height:52px}
.top .wm{font-size:30px;margin-right:auto}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.ibtn:hover{background:var(--chip)}
.ibtn.soft{background:var(--chip)}
.ibtn.acc{background:var(--accent);color:var(--accent-ink)}
.ibtn.acc:hover{filter:brightness(1.05)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.ibtn.on{color:var(--accent)}
.spacer{flex:1}

h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
.h1{font-size:28px;line-height:1.15}
.lede{color:var(--muted);margin:6px 0 0;font-size:13.5px;line-height:1.45}
.pagehead{display:flex;align-items:flex-start;gap:8px;padding:6px 14px 0 18px;flex:none}
.pagehead>div:first-child{flex:1;min-width:0;padding-top:4px}

/* chips & filters */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 18px 6px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 16px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500;color:var(--ink-2);position:relative;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip .badge{position:absolute;top:-5px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.search{margin:12px 18px 0;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:var(--r-sm);padding:0 12px;height:42px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;color:var(--ink);min-width:0}

/* home */
.hello{padding:8px 0 4px}
.hello h1{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.stat{background:var(--chip);border-radius:var(--r-md);padding:12px 10px 10px;display:flex;flex-direction:column;gap:12px;min-height:84px;text-align:left}
.stat b{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-2);line-height:1.2}
.stat.acc{background:var(--accent);color:var(--accent-ink)}
.stat.acc span{color:var(--accent-ink);opacity:.9}
.stat.warn b{color:var(--danger)}

.banner{position:relative;margin-top:16px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--dark-2),var(--dark) 70%);color:var(--on-dark);padding:20px 18px 18px;overflow:hidden;min-height:176px;display:block;width:100%;text-align:left}
.banner h2{font-size:24px;line-height:1.15;max-width:7.5em;position:relative}
.banner p{margin:10px 0 0;font-size:12.5px;color:var(--on-dark-2);max-width:13em;line-height:1.45;position:relative}
.banner .go{margin-top:14px;width:36px;height:28px;border-radius:999px;background:rgba(255,255,255,.14);display:grid;place-items:center;position:relative}
.banner svg.orb{position:absolute;right:-8px;top:8px;width:200px;height:170px}

.sec{margin-top:24px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:20px}
.count{min-width:24px;height:22px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 8px;font-variant-numeric:tabular-nums}
.count.grey{background:var(--chip);color:var(--ink-2)}
.sec-h .more{margin-left:auto;color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:4px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-md);padding:11px 6px 11px 12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.row-main{flex:1;min-width:0}
.row-t{margin:0;font-size:14px;font-weight:500;line-height:1.35}
.row-sub{display:flex;align-items:center;gap:5px;margin-top:4px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.row-sub .blink{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2)}
.row-sub .blink:hover{color:var(--accent-text)}
.parent{font-size:11px;color:var(--muted);margin:0 0 3px;display:flex;gap:4px;align-items:center}
.empty-st{margin-top:18px;background:var(--card);border-radius:var(--r-lg);padding:24px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;box-shadow:var(--shadow)}
.empty-st h3{font-size:19px}
.empty-st p{margin:0 0 6px;color:var(--ink-2);font-size:13px;line-height:1.5;max-width:30ch}
.empty{background:var(--card);border-radius:var(--r-md);padding:16px;color:var(--muted);line-height:1.5;font-size:13px}

.dark-cta{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;border-radius:var(--r-lg);background:linear-gradient(120deg,var(--dark-2),var(--dark));color:var(--on-dark);padding:14px 16px;text-align:left;position:relative;overflow:hidden;min-height:76px}
.dark-cta .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none;position:relative;z-index:1}
.dark-cta .ico.sq{border-radius:14px;background:rgba(255,255,255,.1)}
.dark-cta b{font-family:var(--f-display);font-weight:500;font-size:16.5px;display:block}
.dark-cta small{color:var(--on-dark-2);font-size:12px}
.dark-cta>div{flex:1;position:relative;z-index:1}
.dark-cta svg.orb{position:absolute;right:-20px;bottom:-34px;width:150px;height:110px}
.dark-cta .arr{position:absolute;right:14px;top:12px;z-index:1}

/* due / meta */
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.today{color:var(--accent-text);font-weight:600}
.due.over{color:var(--danger);font-weight:600}
.ind{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.flag{color:var(--accent)}
.flag.low{color:var(--muted)}

/* checkbox circle */
.ck{width:24px;height:24px;border-radius:50%;border:1.6px solid #B9B6C9;display:grid;place-items:center;flex:none;color:#fff;transition:background .15s,border-color .15s}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck.half{border-color:var(--accent);border-style:dashed}
.ck.sq{border-radius:7px;width:22px;height:22px}
.ck:disabled{cursor:default;opacity:.6}

/* board list cards */
.bcard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r-md);padding:12px 4px 12px 12px;box-shadow:var(--shadow);cursor:pointer}
.bcard.hi{background:var(--accent-soft)}
.tile{width:52px;height:52px;border-radius:14px;background:var(--tile);display:grid;place-items:center;flex:none;color:var(--ink)}
.tile.peach{background:var(--tile-peach)} .tile.sage{background:var(--tile-sage)}
.tile.lilac{background:var(--tile-lilac)} .tile.steel{background:var(--tile-steel)} .tile.rose{background:var(--tile-rose)} .tile.sand{background:var(--tile-sand)}
.tile.acc{background:var(--accent);color:#fff}
.tile-btn{position:relative;flex:none;border-radius:20px}
.tile-edit{position:absolute;right:-5px;bottom:-5px;width:26px;height:26px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink-2)}
.ip-prev{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow)}
.ip-prev b{font-family:var(--f-display);font-weight:500;font-size:17px;display:block}
.ip-prev small{color:var(--muted);font-size:12px}
.tints{display:flex;gap:8px;flex-wrap:wrap}
.tints button{width:34px;height:34px;border-radius:11px;box-shadow:inset 0 0 0 1px var(--line)}
.tints button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.ip-chips{display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.ip-chips::-webkit-scrollbar{display:none}
.ip-chips .chip{height:30px;padding:0 12px;font-size:12.5px}
.ip-h{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.sticky-save{position:sticky;bottom:-26px;background:var(--bg);padding-block:10px 4px;margin-bottom:-6px}
.lib-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lib-c{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:var(--r-sm);background:var(--card);position:relative;min-width:0}
.lib-c span:last-child{font-size:10.5px;color:var(--ink-2);text-align:center;line-height:1.2;overflow-wrap:anywhere}
.lib-c.fl{box-shadow:inset 0 0 0 1.5px var(--accent)}
.lib-c.fl::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lib-c .tile{width:44px;height:44px;border-radius:12px}
.flagbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:var(--r-sm);padding:8px 8px 8px 14px;font-size:13px}
.flagbar b{margin-right:auto;font-weight:600}
.mode-sw{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.mode-sw button{height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2)}
.mode-sw button[aria-pressed=true]{background:var(--accent);color:#fff}
.onb{margin-top:18px;background:var(--card);border-radius:var(--r-lg);padding:16px 14px 8px;box-shadow:var(--shadow)}
.onb-t{font-family:var(--f-display);font-size:18px;margin:0 2px 8px}
.onb-s{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line)}
.onb-s:first-of-type{border-top:0}
.onb-s .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.onb-s.done .n{background:var(--accent);color:#fff}
.onb-s.done b{color:var(--muted);text-decoration:line-through}
.onb-s.off{opacity:.55;cursor:default}
.onb-s>div{flex:1;min-width:0}
.onb-s b{font-weight:600;font-size:14px;display:block}
.onb-s small{color:var(--muted);font-size:12px}
.my-role{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;background:var(--card);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--shadow)}
.my-role>.i:first-child{color:var(--accent);width:22px;height:22px}
.my-role>div{flex:1;min-width:0}
.my-role span{font-size:13.5px} .my-role b{font-weight:700}
.my-role small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.4}
.my-role.static{margin-top:0}
.role-seg button{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tg-msg{background:var(--card);border-radius:16px 16px 16px 4px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;line-height:1.45}
.tg-msg p{margin:6px 0 0}
.tg-top{display:flex;align-items:center;gap:8px;font-size:13px}
.tg-top svg{border-radius:7px}
.tg-role{display:flex;align-items:center;gap:6px;color:var(--accent-text)}
.tg-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tg-btns span{height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:600;font-size:12.5px;color:var(--accent-text)}
.st-tile.tile{width:34px;height:34px;border-radius:10px;color:var(--ink)}
.st-tile.tile.acc{color:#fff}
.st-tile.tile .i{width:20px;height:20px}
.bcard.trash{cursor:default;align-items:flex-start}
.trash-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.trash-acts .vchip{height:32px;font-size:12.5px}
.left-warn{color:var(--danger);font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{height:36px;border-radius:10px;background:var(--chip);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.days button.on{background:var(--accent);color:#fff}
input.mini-sel{font-variant-numeric:tabular-nums;padding:0 10px}
.pg-btn{height:34px;padding:0 14px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.tile .i{width:24px;height:24px;stroke-width:1.5}
.tile.big{width:72px;height:72px;border-radius:20px}
.tile.big .i{width:34px;height:34px}
.tile.xs{width:30px;height:30px;border-radius:9px}
.tile.xs .i{width:17px;height:17px}
.bcard-main{flex:1;min-width:0}
.bcard-main b{font-family:var(--f-display);font-weight:500;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard-main small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.star{color:var(--muted)} .star.on{color:var(--accent)}
.team-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 2px 2px}

.avs{display:inline-flex}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#3a3348;flex:none;box-shadow:0 0 0 2px var(--card)}
.avs .av+.av{margin-left:-6px}
.av.lg{width:34px;height:34px;font-size:13px}
.av.md{width:26px;height:26px;font-size:11px}
.c-peach{background:#F6C9B0} .c-lilac{background:#CFC6EE} .c-steel{background:#C3CDE2} .c-sage{background:#C7DCCD} .c-rose{background:#EFC4D0} .c-sand{background:#E8D9B5}

/* board screen */
.b-head{display:flex;gap:16px;align-items:center;padding:4px 0 0}
.b-head h1{font-size:27px}
.b-head p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.b-team{display:flex;align-items:center;gap:8px;margin-top:16px}
.b-team .avs .av{box-shadow:0 0 0 2px var(--bg)}
.pill-btn{height:36px;padding:0 14px;border-radius:999px;background:var(--chip);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
.tabs .chip{justify-content:center;padding:0 6px}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--chip);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:12px}
.note .i{margin-top:1px}

.stage{background:var(--bg);border-radius:var(--r-lg);margin-top:14px;padding:8px;box-shadow:inset 0 0 0 1px var(--line);background:color-mix(in srgb,var(--card) 55%,var(--bg))}

const TODAY=new Date();TODAY.setHours(0,0,0,0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const day=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d)};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diff=s=>Math.round((parse(s)-TODAY)/864e5);
const fShort=new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'short'});
const fLong=new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long'});
const fWeek=new Intl.DateTimeFormat('uk-UA',{weekday:'long',day:'numeric',month:'long'});

function dueText(s,time){const n=diff(s);let t;
 if(n===0)t='Сьогодні';else if(n===1)t='Завтра';else if(n===-1)t='Учора';else t=fShort.format(parse(s));
 return time&&Math.abs(n)<=1?t+', '+time:t}
function dueChip(s,time,done){if(!s)return'';const n=diff(s);
 const cls=done?'':n<0?'over':n===0?'today':'';
 return `<span class="due ${cls}">${ic(n===0&&!done?'clock':'cal','sm')}${dueText(s,time)}</span>`}
const pl=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return n+' '+(a>10&&a<20?f[2]:b===1?f[0]:b>=2&&b<=4?f[1]:f[2])};

 if(f==='fav')list=list.filter(b=>b.fav);
 if(q)list=list.filter(b=>b.name.toLowerCase().includes(q)||b.desc.toLowerCase().includes(q));
 const P=type==='personal';

 else body=list.length?list.map(bCard).join(''):`<div class="empty">${q?'Нічого не знайдено. Спробуйте іншу назву.':f==='fav'?'Позначте дошки зірочкою, і вони з\'являться тут.':f==='arch'?'В архіві порожньо.':'Дошок поки немає.'}</div>`;
 if(f==='trash')body=`<div class="note" style="margin-top:0">${ic('trash','sm')}<span>Видалені дошки зберігаються тут ${TRASH_DAYS} днів разом із задачами. Потім вони видаляються назавжди.</span></div>`

 else if(tab==='list'){const grp=[['Прострочено',t=>!isDone(t)&&t.due&&diff(t.due)<0],['Сьогодні',t=>!isDone(t)&&t.due&&diff(t.due)===0],['Цього тижня',t=>!isDone(t)&&t.due&&diff(t.due)>0&&diff(t.due)<=7],['Пізніше',t=>!isDone(t)&&t.due&&diff(t.due)>7],['Без терміну',t=>!isDone(t)&&!t.due],['Виконано',isDone]];

function fileRow(f,t,withTask){const ext=(f.n.split('.').pop()||'').slice(0,4).toUpperCase();
 return `<div class="file"><span class="file-ic">${esc(ext)}</span><div style="flex:1;min-width:0"><b style="font-weight:500;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.n)}</b><small>${esc(f.s)}${withTask?` · ${esc(t.title)}`:''}</small></div>${withTask?`<button class="ibtn" data-a="openTask" data-id="${t.id}" aria-label="Відкрити задачу">${ic('chevR')}</button>`:''}</div>`}

function vTask(id){const t=getT(id);if(!t)return vGone();const b=getB(t.board);const st=stageOf(t);const edit=canEdit(b);const done=isDone(t);
 const sd=t.subs.filter(s=>s.st==='done').length;const dis=edit?'':'disabled';
 const labels=t.labels.map((l,i)=>`<span class="lbl l${i%4}">${esc(l)}</span>`).join('');
 return `<div class="screen"><div class="top"><button class="ibtn" data-a="back" aria-label="Назад">${ic('back')}</button><span class="spacer"></span>
  <button class="ibtn star ${t.fav?'on':''}" data-a="favTask" data-id="${t.id}" aria-label="Обране">${ic('star',t.fav?'fill':'')}</button>
  ${edit?`<button class="ibtn" data-a="sheet" data-s="taskMenu" data-id="${t.id}" aria-label="Дії із задачею">${ic('more')}</button>`:''}</div>
 <div class="scroll">
  <button class="crumb" data-a="openBoard" data-id="${b.id}">${tile(b,'xs')}${esc(b.name)}<span style="color:var(--muted)">·</span>${esc(st?.name||'')}</button>
  <div class="t-head"><button class="ck ${done?'on':''}" data-a="toggleDone" data-id="${t.id}" ${dis} aria-label="Позначити виконаною">${done?ic('check'):''}</button>
   <textarea class="t-title" id="tt-${t.id}" data-bind="title" data-id="${t.id}" rows="1" ${edit?'':'readonly'} aria-label="Назва задачі">${esc(t.title)}</textarea></div>
  <textarea class="desc" id="td-${t.id}" data-bind="desc" data-id="${t.id}" placeholder="Додайте опис…" ${edit?'':'readonly'} aria-label="Опис">${esc(t.desc)}</textarea>
  <div class="fields">
   <div class="field">${ic('shapes')}<span>Іконка</span><div class="fv"><button class="vchip" data-a="sheet" data-s="taskIcon" data-id="${t.id}" ${dis}>${t.icon?`<span class="tile xs ${t.tint||''}" style="width:22px;height:22px;border-radius:7px">${ic(t.icon,'sm')}</span>${esc(ICON_NAME[t.icon]||'')}`:'Без іконки'}${edit?ic('chevD','sm'):''}</button></div></div>
   <div class="field">${ic('cal')}<span>Термін</span><div class="fv"><label class="vchip"><input type="date" id="tdue-${t.id}" data-bind="due" data-id="${t.id}" value="${t.due||''}" ${dis} aria-label="Дата"></label>
    ${t.due?`<label class="vchip"><input type="time" id="ttime-${t.id}" data-bind="time" data-id="${t.id}" value="${t.time}" ${dis} aria-label="Час"></label>${edit?`<button class="vchip" data-a="clearDue" data-id="${t.id}" aria-label="Прибрати термін"><span class="x">${ic('x','sm')}</span></button>`:''}`:''}</div></div>
   <div class="field">${ic('flag')}<span>Пріоритет</span><div class="fv"><button class="vchip ${t.pr==='high'?'acc':''}" data-a="sheet" data-s="priority" data-id="${t.id}" ${dis}>${PR[t.pr]}${edit?ic('chevD','sm'):''}</button></div></div>
   <div class="field">${ic('list')}<span>Етап</span><div class="fv"><button class="vchip" data-a="sheet" data-s="move" data-id="${t.id}" ${dis}><span style="display:inline-grid;place-items:center">${ic(st.icon||KIND_ICON[st.kind],'sm')}</span>${esc(st.name)}${edit?ic('chevD','sm'):''}</button></div></div>
   <div class="field">${ic('tag')}<span>Мітки</span><div class="fv">${labels}${edit?`<button class="plus-c" data-a="sheet" data-s="label" data-id="${t.id}" aria-label="Додати мітку">${ic('plus','sm')}</button>`:labels?'':'<span class="ro">немає</span>'}</div></div>
   <div class="field">${ic('user')}<span>Відповідальний</span><div class="fv"><button class="vchip" data-a="sheet" data-s="who" data-id="${t.id}" ${dis}>${av(t.who)}${esc(U[t.who].f)}${edit&&b.members.length>1?ic('chevD','sm'):''}</button></div></div>
   ${b.members.length>1?`<div class="field">${ic('users')}<span>Співучасники</span><div class="fv">${t.people.length?avs(t.people,5,'md'):'<span class="ro">немає</span>'}${edit?`<button class="plus-c" data-a="sheet" data-s="people" data-id="${t.id}" aria-label="Додати співучасників">${ic('plus','sm')}</button>`:''}</div></div>`:''}
  </div>
  <div class="hr"></div>
  <div class="subs-h">${ic('subs')}<h3>Підзадачі</h3><span class="n">${sd}/${t.subs.length}</span></div>
  ${t.subs.map(s=>`<div class="sub"><button class="ck sq ${s.st==='done'?'on':s.st==='prog'?'half':''}" data-a="subCycle" data-id="${t.id}" data-sub="${s.id}" ${dis} aria-label="Статус: ${SUB_ST[s.st]}">${s.st==='done'?ic('check','sm'):''}</button>
    <button class="sub-main" data-a="sheet" data-s="sub" data-id="${t.id}" data-sub="${s.id}"><p class="${s.st==='done'?'done':''}">${esc(s.title)}</p><small>${s.st==='prog'?'<span class="st-word prog">В роботі</span>':''}${s.due?dueChip(s.due,'',s.st==='done'):''}${s.comments.length?`<span class="ind">${ic('msg','sm')}${s.comments.length}</span>`:''}</small></button>${av(s.who,'md')}</div>`).join('')}
  ${edit?`<form class="add-sub" data-f="addSub" data-id="${t.id}">${ic('plus','sm')}<input id="addsub-${t.id}" placeholder="Додати підзадачу" autocomplete="off" aria-label="Нова підзадача"></form>`:''}
  ${t.subs.length&&sd===t.subs.length&&!done?`<div class="hint">Усі підзадачі виконано. Саму задачу закриває відповідальний окремо, коли результат готовий${b.type==='shared'?' і перевірений':''}.</div>`:''}
  <div class="hr"></div>
  <div class="subs-h">${ic('msg')}<h3>Коментарі</h3><span class="n">${t.comments.length}</span></div>
  ${t.comments.map(c=>`<div class="cm">${av(c.u,'md')}<div><b>${esc(U[c.u].f)}</b> <small>${esc(when(c))}</small><p>${esc(c.t)}</p></div></div>`).join('')||'<p class="ro">Коментарів поки немає.</p>'}
  <div style="height:8px"></div></div>
  ${edit?`<form class="composer" data-f="comment" data-id="${t.id}"><input id="cm-${t.id}" placeholder="Додати коментар…" autocomplete="off" aria-label="Коментар"><button class="send" aria-label="Надіслати">${ic('send')}</button></form>`:''}</div>`}

function vSettings(){const n=S.notif;const sw=(k,l,d)=>`<button class="set-r" data-a="notif" data-k="${k}" role="switch" aria-checked="${n[k]}"><div>${l}${d?`<small>${d}</small>`:''}</div><span class="sw ${n[k]?'on':''}"></span></button>`;
 return `<div class="screen"><div class="top"><button class="ibtn" data-a="back" aria-label="Назад">${ic('back')}</button><span class="spacer"></span></div>
 <div class="scroll"><h1 class="h1">Налаштування</h1>
  <p class="set-t">Профіль Telegram</p><div class="set-g"><div class="set-r">${av('me','lg')}<div><b style="font-weight:600">${U.me.n}</b><small>${U.me.un} · дані беруться з Telegram</small></div></div></div>
  <p class="set-t">Тема оформлення</p><div class="set-g" style="padding:10px"><div class="seg">${[['system','Системна'],['light','Світла'],['dark','Темна']].map(([k,l])=>`<button class="${S.theme===k?'on':''}" data-a="theme" data-k="${k}">${l}</button>`).join('')}</div></div>
  <div class="set-g"><button class="set-r" data-a="sheet" data-s="iconLib"><span class="tile xs peach">${ic('shapes')}</span><div>Бібліотека іконок<small>${ICON_COUNT} іконок для дошок і задач</small></div>${ic('chevR','sm')}</button></div>
  <p class="set-t">Сповіщення в боті</p><div class="set-g">
   ${sw('assign','Призначення задач і підзадач')}
   ${sw('due','Нагадування про терміни')}

   ${sw('invite','Запрошення до дошок')}
   ${sw('changes','Зміни в моїх задачах','Новий коментар, зміна терміну чи статусу')}
   <button class="set-r" data-a="quietToggle" role="switch" aria-checked="${S.quiet.on}"><div>Тихі години<small>${S.quiet.on?`З ${S.quiet.from} до ${S.quiet.to} бот мовчить, повідомлення прийдуть після`:'Бот може писати в будь-який час'}</small></div><span class="sw ${S.quiet.on?'on':''}"></span></button>
   ${S.quiet.on?`<div class="set-r"><div>З</div><input type="time" class="mini-sel" id="q-from" data-bind="quiet" data-k="from" value="${S.quiet.from}"><div style="flex:none">до</div><input type="time" class="mini-sel" id="q-to" data-bind="quiet" data-k="to" value="${S.quiet.to}"></div>`:''}</div>
  <p class="set-t">Сповіщення дошок</p><div class="set-g">${B.filter(live).map(b=>`<button class="set-r" data-a="sheet" data-s="boardNotif" data-id="${b.id}">${tile(b,'xs')}<div>${esc(b.name)}<small>${esc(bnSummary(b))}</small></div>${ic(b.notif.on?'chevR':'bellOff','sm')}</button>`).join('')||'<p class="prose">Дошок поки немає.</p>'}</div>
  <p class="ro" style="margin:8px 4px 0">Для кожної дошки окремо: вимкнути сповіщення, отримувати добірку задач у потрібний час і вибрати події.</p>
  <p class="set-t">Доступ і приватність</p><div class="set-g"><p class="prose">Особисті дошки бачите лише ви. Якщо надати доступ до однієї дошки, інші залишаються приватними. Учасники спільної дошки бачать тільки її вміст. Керувати учасниками конкретної дошки можна всередині неї.</p></div>
  ${window.ORVI_APP?`<p class="set-t">Дані</p><div class="set-g"><p class="prose" style="padding-bottom:4px">Ваші дошки й налаштування зберігаються на сервері orvi. і відкриваються на будь-якому пристрої, де ви користуєтеся цим акаунтом Telegram.</p><button class="set-r" data-a="sheet" data-s="resetData" style="color:var(--danger)">${ic('trash')}<div>Почати спочатку<small>Видалити ваші дошки, задачі й налаштування</small></div></button></div>`:''}
  <p class="set-t">Допомога</p><div class="set-g">
   ${[['boards','Дошки та етапи'],['subs','Підзадачі й відповідальні'],['roles','Запрошення та ролі']].map(([k,l])=>`<button class="set-r" data-a="sheet" data-s="help" data-k="${k}"><div>${l}</div>${ic('chevR','sm')}</button>`).join('')}</div>
  <p class="lede" style="text-align:center;margin:24px 0 8px"><span class="wm" style="font-size:16px">orvi<b>.</b></span> · прототип 0.1</p></div></div>`}

function vGone(){return `<div class="screen"><div class="top"><button class="ibtn" data-a="back">${ic('back')}</button></div><div class="scroll"><div class="empty">Цей елемент видалено або доступ до нього закрито.</div></div></div>`}

function nav(){const it=[['home','Головна','home'],['personal','Особисті','folder'],['shared','Спільні','users']];
 return `<nav class="nav">${it.map(([k,l,i])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-t="${k}" aria-current="${S.tab===k?'page':'false'}">${ic(i,S.tab===k?'fill':'')}${l}</button>`).join('')}</nav>`}

/* ---------- sheets ---------- */
function sheetWrap(title,body,dk){return `<div class="scrim ${S.fresh?'anim':''}" data-a="closeScrim"><div class="sheet ${dk?'dk':''} ${S.fresh?'anim':''}" role="dialog" aria-label="${esc(title)}"><div class="grab"></div>
 <div class="sheet-h"><h2>${title}</h2><button class="ibtn" data-a="close" aria-label="Закрити">${ic('x')}</button></div><div class="sheet-body">${body}</div></div></div>`}
function vSheet(){const sh=S.sheet;if(!sh)return'';const t=sh.id&&getT(sh.id);
 switch(sh.type){
 case 'about':return sheetWrap('',`<div style="display:flex;gap:14px;align-items:center">${logo(64)}<div><span class="wm" style="font-size:34px">orvi<b>.</b></span><p style="margin:4px 0 0;color:var(--on-dark-2)">Порядок створює свободу</p></div></div>
  ${[['home','Один огляд','Задачі з усіх дошок, призначені вам, збираються на головній без дублікатів.'],['folder','Особисті й спільні дошки','Доступ відкривається лише до конкретної дошки, решта лишається приватною.'],['subs','Підзадачі з виконавцями','Кожна має свого виконавця, термін і статус. Основна задача закривається окремо.'],['bell','Бот у Telegram','Нагадування про терміни, призначення й запрошення за актуальними даними.']].map(([i,b,s])=>`<div class="feat">${ic(i)}<div><b>${b}</b><span>${s}</span></div></div>`).join('')}
  <button class="btn acc" data-a="close">Зрозуміло</button>`,true);
 case 'notifs':return sheetWrap('Сповіщення',botMsgs().filter(m=>!m.me&&!m.start).map(m=>m.sys?`<p class="ro" style="text-align:center">${m.html}</p>`:`<div class="opt" style="align-items:flex-start">${ic('bell')}<div style="flex:1"><span style="font-size:13.5px;line-height:1.45">${m.html}</span>${m.btn?`<button class="vchip acc" style="margin-top:8px" data-a="${m.btn.a}" data-id="${m.btn.id||''}" data-sub="${m.btn.sub||''}">${m.btn.l}</button>`:''}</div></div>`).join('')||'<p class="ro">Нових сповіщень немає.</p>');
 case 'create':{const tp=sh.bt||'personal';
  return sheetWrap('Нова дошка',`<div class="seg"><button class="${tp==='personal'?'on':''}" data-a="sf" data-k="bt" data-v="personal">Особиста</button><button class="${tp==='shared'?'on':''}" data-a="sf" data-k="bt" data-v="shared">Спільна</button></div>
  <p class="lab">Назва</p><input class="inp" id="nb-name" data-bind="sf" data-k="name" value="${esc(sh.name||'')}" placeholder="${tp==='shared'?'Наприклад, Дизайн-команда':'Наприклад, План тижня'}" autocomplete="off">${sh.err?`<p class="err">${sh.err}</p>`:''}
  <p class="lab">Іконка</p>${iconPicker(sh,'target')}
  <p class="lab">Опис, якщо потрібен</p><input class="inp" id="nb-desc" data-bind="sf" data-k="desc" value="${esc(sh.desc||'')}" placeholder="Для чого ця дошка" autocomplete="off">
  ${tp==='shared'?`<div class="note">${ic('shield','sm')}<span>Ви станете власником і зможете запросити учасників після створення.</span></div>`:''}
  <button class="btn acc" data-a="createBoard">Створити дошку</button>`)}
 case 'join':{const r=sh.res;const inv=r&&r.ok?(INV.find(i=>i.link===r.code)||LINK_ONLY.find(i=>i.link===r.code)):null;
  return sheetWrap('Приєднатися за посиланням',`<p class="lede" style="margin:0">Вставте посилання-запрошення, яке вам надіслали в Telegram.</p>
  <input class="inp" id="join-link" data-bind="sf" data-k="link" value="${esc(sh.link||'')}" placeholder="t.me/${BOT}?start=join_…" autocomplete="off">
  ${window.ORVI_APP?'':`<p class="lab">Приклади посилань для прев'ю</p>`}<div class="fv" ${window.ORVI_APP?'hidden':''}>${LINK_ONLY.map(i=>`<button class="vchip" data-a="sf" data-k="link" data-v="https://${joinUrl(i.link)}">${ic(ROLE_IC[i.role],'sm')}${ROLE[i.role]}</button>`).join('')}</div>
  <button class="btn acc" data-a="checkLink" ${r&&r.busy?'disabled':''}>${r&&r.busy?'Перевіряємо…':'Перевірити посилання'}</button>
  ${r&&r.ok===false?`<p class="err">${r.msg}</p>`:''}
  ${inv?`<div class="preview-card"><span class="tile ${inv.tint}">${ic(inv.icon)}</span><div style="flex:1"><b style="font-family:var(--f-display);font-weight:500;font-size:16px">${esc(inv.name)}</b><small style="display:block;color:var(--muted);font-size:12px;margin-top:2px">${esc(U[inv.from].f)} запрошує · ${pl(inv.people,W.mem)}</small></div></div>
   <div class="my-role static">${ic(ROLE_IC[inv.role])}<div><span>Ваша роль: <b>${ROLE[inv.role]}</b></span><small>${ROLE_CAN[inv.role]}</small></div></div>
   <p class="ro" style="margin:0">Посилання дійсне. Ви отримаєте доступ лише до цієї дошки.</p><button class="btn acc" data-a="acceptInv" data-id="${inv.id}">Приєднатися як ${ROLE_ACC[inv.role]}</button>`:''}
  ${r&&r.ok&&r.board?`<div class="preview-card">${tile(getB(r.board))}<div style="flex:1"><b>${esc(getB(r.board).name)}</b><small style="display:block;color:var(--muted)">Ви вже учасник цієї дошки</small></div></div><button class="btn acc" data-a="openBoard" data-id="${r.board}">Відкрити дошку</button>`:''}`)}
 case 'invite':{const i=INV.find(x=>x.id===sh.id);if(!i)return'';
  return sheetWrap('Запрошення',`<div class="preview-card"><span class="tile ${i.tint}">${ic(i.icon)}</span><div style="flex:1"><b style="font-family:var(--f-display);font-weight:500;font-size:17px">${esc(i.name)}</b><small style="display:block;color:var(--muted);font-size:12px;margin-top:2px">${i.team?esc(i.team)+' · ':''}${pl(i.people,W.mem)}</small></div></div>
  <div class="opt">${av(i.from,'md')}<div>${esc(U[i.from].n)} запрошує вас приєднатися</div></div>
  <div class="my-role static">${ic(ROLE_IC[i.role])}<div><span>Ваша роль: <b>${ROLE[i.role]}</b></span><small>${ROLE_CAN[i.role]}</small></div></div>
  <div class="btn-row"><button class="btn ghost" data-a="declineInv" data-id="${i.id}">Відхилити</button><button class="btn acc" data-a="acceptInv" data-id="${i.id}">Прийняти</button></div>`)}
 case 'boardMenu':{const b=getB(sh.id);if(!b)return'';const owner=myRole(b)==='owner';
  if(sh.confirm)return sheetWrap('Видалити дошку?',`<p class="lede" style="margin:0">«${esc(b.name)}» разом із задачами переміститься в кошик${b.type==='shared'?' і зникне в учасників':''}. Протягом ${TRASH_DAYS} днів її можна відновити, потім вона видалиться назавжди.</p><div class="btn-row"><button class="btn ghost" data-a="sf" data-k="confirm" data-v="">Скасувати</button><button class="btn acc" style="background:var(--danger)" data-a="deleteBoard" data-id="${b.id}">Видалити</button></div>`);
  if(sh.rename)return sheetWrap('Перейменувати дошку',`<input class="inp" id="rn-board" data-bind="sf" data-k="name" value="${esc(sh.name??b.name)}" autocomplete="off"><button class="btn acc" data-a="renameBoard" data-id="${b.id}">Зберегти</button>`);
  return sheetWrap(esc(b.name),`<button class="opt" data-a="fav" data-id="${b.id}" data-close="1">${ic('star',b.fav?'fill':'')}<div>${b.fav?'Прибрати з обраних':'Додати в обрані'}</div></button>
   <button class="opt" data-a="sheet" data-s="boardNotif" data-id="${b.id}">${ic(b.notif.on?'bell':'bellOff')}<div>Сповіщення<small>${esc(bnSummary(b))}</small></div></button>
   ${canEdit(b)?`<button class="opt" data-a="sf" data-k="rename" data-v="1">${ic('edit')}<div>Перейменувати</div></button><button class="opt" data-a="sheet" data-s="boardIcon" data-id="${b.id}">${tile(b,'xs')}<div>Змінити іконку<small>${esc(ICON_NAME[b.icon]||'')}</small></div></button>`:''}
   ${owner||b.type==='shared'?`<button class="opt" data-a="sheet" data-s="members" data-id="${b.id}">${ic('userplus')}<div>${b.type==='personal'?'Надати доступ до цієї дошки':'Учасники й доступ'}<small>${b.type==='personal'?'Інші ваші дошки залишаться приватними':pl(b.members.length,W.mem)}</small></div></button>`:''}
   ${owner?`<button class="opt" data-a="archive" data-id="${b.id}">${ic('archive')}<div>${b.archived?'Повернути з архіву':'В архів'}</div></button><button class="opt danger" data-a="sf" data-k="confirm" data-v="1">${ic('trash')}<div>Видалити дошку</div></button>`:''}

const DUE_WHEN={same:'У день терміну',before1:'За день до терміну',before2:'За 2 дні до терміну',off:'Не нагадувати'};
const TIMED={'15m':'за 15 хвилин','1h':'за 1 годину','3h':'за 3 години',off:'не нагадувати'};

function daysLabel(d){const k=[...d].sort().join();if(d.length===7)return'щодня';if(k==='1,2,3,4,5')return'пн–пт';if(k==='0,6')return'сб–нд';if(!d.length)return'жодного дня';return WD.filter(([,n])=>d.includes(n)).map(([l])=>l.toLowerCase()).join(', ')}
function inQuiet(t){const q=S.quiet;if(!q.on)return false;return q.from<q.to?(t>=q.from&&t<q.to):(t>=q.from||t<q.to)}
function bnSummary(b){const n=b.notif;if(!n.on)return'Вимкнено';const p=[];if(n.digest.on)p.push(`добірка о ${n.digest.time}, ${daysLabel(n.digest.days)}`);if(n.due.when!=='off')p.push(`терміни о ${n.due.time}`);return p.join(' · ')||'Лише події'}
function myItems(b,scope,shift=0){const out=[];T.filter(t=>t.board===b.id&&!isDone(t)).forEach(t=>{if(t.who==='me')out.push({t,d:t.due});t.subs.forEach(s=>{if(s.who==='me'&&s.st!=='done')out.push({t,s,d:s.due})})});
 return out.filter(x=>scope==='all'||(x.d&&(scope==='today'?diff(x.d)-shift<=0:diff(x.d)-shift<=7))).sort((a,c)=>(a.d||'9').localeCompare(c.d||'9'))}
function nextRun(days,time){const now=new Date();const [h,m]=time.split(':').map(Number);for(let i=0;i<8;i++){const d=new Date(TODAY);d.setDate(d.getDate()+i);if(!days.includes(d.getDay()))continue;const at=new Date(d);at.setHours(h,m,0,0);if(at>now)return{i,d}}return null}
const runLabel=r=>r.i===0?'Сьогодні':r.i===1?'Завтра':cap(new Intl.DateTimeFormat('uk-UA',{weekday:'long'}).format(r.d));
function vBoardNotif(b){const n=b.notif;const sh=b.type==='shared'||b.members.length>1;const owner=myRole(b)==='owner';const hasRev=b.stages.some(s=>s.kind==='rev');

 const run=n.digest.days.length?nextRun(n.digest.days,n.digest.time):null;const items=myItems(b,n.digest.scope,run?run.i:0);
 return `<div class="set-g" style="margin:0">${sw('on','Сповіщення з цієї дошки',n.on?bnSummary(b):'Бот нічого не надсилатиме з «'+esc(b.name)+'». Задачі й далі видно на головній.',n.on)}</div>

  ${sw('digest.on','Надсилати список задач','Бот надішле ваші задачі з цієї дошки у вибраний час',n.digest.on)}

   <div class="fv" style="margin-top:8px">${[['Щодня',[1,2,3,4,5,6,0]],['Будні',[1,2,3,4,5]],['Вихідні',[6,0]]].map(([l,d])=>`<button class="vchip" data-a="bnDays" data-id="${b.id}" data-d="${d.join(',')}">${l}</button>`).join('')}</div></div>

  ${n.digest.on?`<p class="ro" style="margin:8px 4px 0">${run?`${runLabel(run)} о ${n.digest.time}: ${items.length?pl(items.length,W.task):'задач немає'+(n.digest.skipEmpty?', повідомлення не надійде':'')}.`:'Оберіть хоча б один день.'}${sh?' Лише задачі й підзадачі, призначені вам.':''}${inQuiet(n.digest.time)?` <b style="color:var(--danger)">Цей час припадає на тихі години, тож добірка прийде о ${S.quiet.to}.</b>`:''}</p>`:''}
  <p class="set-t" style="margin-top:14px">Нагадування про терміни</p><div class="set-g" style="margin:0">

 <p class="ro" style="margin:10px 4px 0">Ці налаштування стосуються лише вас. Інші учасники налаштовують сповіщення для себе самі.${S.quiet.on?` Тихі години ${S.quiet.from}–${S.quiet.to} діють для всіх дошок.`:''}</p>
 <button class="btn acc" data-a="close">Готово</button>`}

 B.filter(b=>live(b)&&!b.archived&&b.notif.on&&b.notif.digest.on&&b.notif.digest.days.length).map(b=>({b,r:nextRun(b.notif.digest.days,b.notif.digest.time)})).filter(x=>x.r).sort((x,y)=>x.r.i-y.r.i||x.b.notif.digest.time.localeCompare(y.b.notif.digest.time)).slice(0,2).forEach(({b,r})=>{

  if(!it.length){if(b.notif.digest.skipEmpty)m.push({sys:true,html:`${when} · «${esc(b.name)}»: задач немає, добірка не надсилається.`});else m.push({html:`☀️ <b>${when}</b> · ${esc(b.name)}<br>Задач немає. Гарного дня!`});return}
  m.push({html:`☀️ <b>${when}</b> · ${esc(b.name)}<br>${{today:'На сьогодні',week:'Найближчий тиждень',all:'Відкриті задачі'}[b.notif.digest.scope]}: ${pl(it.length,W.task)}${it.slice(0,3).map(x=>`<br>• ${esc(x.s?x.s.title:x.t.title)}${x.d?` <span style="color:var(--muted)">(${rel(x.d)})</span>`:''}`).join('')}${it.length>3?`<br><span style="color:var(--muted)">і ще ${it.length-3}</span>`:''}`,btn:{l:'Відкрити дошку',a:'botBoard',id:b.id}})});

 const list=h.closest('.stages');const sec=h.closest('.stage');const sc=list.closest('.scroll');
 drag={list,sec,sc,y:e.clientY,off:0};list.classList.add('reorder');sec.classList.add('dragging');
 const r=sec.getBoundingClientRect();drag.off=e.clientY-(r.top+r.height/2);try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const{list,sec,sc}=drag;const y=e.clientY;
 const sr=sc.getBoundingClientRect();if(y<sr.top+50)sc.scrollTop-=10;else if(y>sr.bottom-50)sc.scrollTop+=10;
 const others=[...list.querySelectorAll('.stage')].filter(x=>x!==sec);
 let before=null;for(const o of others){const r=o.getBoundingClientRect();if(y-drag.off<r.top+r.height/2){before=o;break}}
 if(before!==sec.nextElementSibling)before?list.insertBefore(sec,before):list.appendChild(sec)},{passive:false});
const endDrag=()=>{if(!drag)return;const{list,sec}=drag;drag=null;list.classList.remove('reorder');sec.classList.remove('dragging');
 const b=getB(list.dataset.b);if(!b){render();return}const prev=b.stages.map(x=>x.id);const order=[...list.querySelectorAll('.stage')].map(x=>x.dataset.id);
 const changed=order.join()!==b.stages.map(x=>x.id).join();b.stages.sort((a,c)=>order.indexOf(a.id)-order.indexOf(c.id));
 if(changed)toast('Порядок етапів змінено',{type:'stages',board:b.id,order:prev});render()};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

/* task drag & drop: touch = long press, mouse = press and move */
let td=null,eatClick=false;
document.addEventListener('pointerdown',e=>{const card=e.target.closest('[data-tdrag]');if(!card||e.button>0||e.target.closest('button,input,a'))return;
 td={card,id:card.dataset.id,x:e.clientX,y:e.clientY,on:false,touch:e.pointerType!=='mouse'};
 if(td.touch){card.classList.add('pressing');td.timer=setTimeout(()=>liftTask(),420)}});
function liftTask(){if(!td)return;const{card}=td;const r=card.getBoundingClientRect();td.on=true;td.dx=td.x-r.left;td.dy=td.y-r.top;
 const ph=document.createElement('div');ph.className='t-ph';ph.style.height=r.height+'px';card.parentNode.insertBefore(ph,card);td.ph=ph;
 card.classList.remove('pressing');card.classList.add('lifted');card.style.width=r.width+'px';card.style.left=r.left+'px';card.style.top=r.top+'px';
 td.sc=card.closest('.scroll');try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}
function taskOver(x,y){const{card,ph}=td;card.style.left=(x-td.dx)+'px';card.style.top=(y-td.dy)+'px';
 const sr=td.sc.getBoundingClientRect();if(y<sr.top+60)td.sc.scrollTop-=12;else if(y>sr.bottom-60)td.sc.scrollTop+=12;
 const el=document.elementFromPoint(x,y);const st=el&&el.closest('.stage');
 document.querySelectorAll('.stage.drop').forEach(n=>n!==st&&n.classList.remove('drop'));td.target=st||td.target;
 if(!st)return;st.classList.add('drop');const cards=st.querySelector('.cards');
 if(!cards){ph.remove();return}
 let before=null;for(const o of cards.querySelectorAll('.tcard:not(.lifted)')){const r=o.getBoundingClientRect();if(y<r.top+r.height/2){before=o;break}}
 if(before){if(ph.nextSibling!==before)cards.insertBefore(ph,before)}else if(cards.lastElementChild!==ph)cards.appendChild(ph)}
document.addEventListener('pointermove',e=>{if(!td)return;const d=Math.hypot(e.clientX-td.x,e.clientY-td.y);
 if(!td.on){if(d>8){if(td.touch){clearTimeout(td.timer);td.card.classList.remove('pressing');td=null}else liftTask()}return}
 e.preventDefault();taskOver(e.clientX,e.clientY)},{passive:false});
document.addEventListener('touchmove',e=>{if(td&&td.on)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(td)e.preventDefault()});
function dropTask(cancel){if(!td)return;const t0=td;td=null;clearTimeout(t0.timer);t0.card.classList.remove('pressing');if(!t0.on)return;
 eatClick=true;setTimeout(()=>eatClick=false,350);document.querySelectorAll('.stage.drop').forEach(n=>n.classList.remove('drop'));
 const t=getT(t0.id);const st=t0.ph.isConnected?t0.ph.closest('.stage'):t0.target;
 if(cancel||!st||!t||!st.isConnected||!getB(t.board).stages.some(x=>x.id===st.dataset.id)){t0.card.classList.remove('lifted');render();return}
 const snap={type:'task',id:t.id,stage:t.stage,ords:T.filter(x=>x.board===t.board).map(x=>[x.id,x.ord]),cancelled:S.cancelled.length};
 const sid=st.dataset.id;const before=stageOf(t)?.id;let msg='Порядок задач змінено';
 if(sid!==before)msg=moveTo(t,sid);
 const cards=st.querySelector('.cards');
 if(cards){const order=[...cards.children].map(n=>n===t0.ph?t.id:n===t0.card?null:n.dataset.id).filter(Boolean);
  order.forEach((id,i)=>{const x=getT(id);if(x)x.ord=i})}
 else{t.ord=1e5;msg=msg+'. Етап згорнуто, задача внизу'}
 const moved=snap.stage!==t.stage||snap.ords.some(([id,o])=>getT(id)?.ord!==o);
 if(moved)toast(msg,snap);render()}
function abortDrags(){if(td)dropTask(true);if(drag)endDrag();if(pendingRender)render()}
window.addEventListener('blur',abortDrags);document.addEventListener('visibilitychange',()=>{if(document.hidden)abortDrags()});
document.addEventListener('pointerup',()=>{dropTask(false);if(pendingRender)render()});document.addEventListener('pointercancel',()=>dropTask(true));
document.addEventListener('click',e=>{if(eatClick){e.stopPropagation();e.preventDefault();eatClick=false}},true);

function saveFlags(){try{localStorage.setItem('orvi-flagged',JSON.stringify([...S.flagged]))}catch(e){}}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;
 if(el.disabled)return;if(el.dataset.a==='closeScrim'&&e.target!==el)return;e.preventDefault();e.stopPropagation();if(fn(el.dataset,el,e)===false)return;render()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}
 if(e.key==='Escape'&&(td||drag)){abortDrags();return}
 if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const d=f.dataset;const val=id=>(document.getElementById(id)?.value||'').trim();
 switch(d.f){
 case 'addTask':{const v=f.querySelector('input').value.trim();if(!v)return;const b=getB(d.id);const t={id:nid('t'),board:d.id,stage:d.st,title:v,desc:'',due:null,time:'',pr:'med',who:'me',people:[],labels:[],fav:false,subs:[],comments:[],files:[]};T.push(t);toast('Задачу додано');break}
 case 'quickAdd':{const v=val('qa-title');if(!v)return;T.push({id:nid('t'),board:d.id,stage:val('qa-stage'),title:v,desc:'',due:val('qa-due')||null,time:'',pr:'med',who:'me',people:[],labels:[],fav:false,subs:[],comments:[],files:[]});S.sheet=null;S.btab[d.id]='board';toast('Задачу додано');break}
 case 'addSub':{const v=val('addsub-'+d.id);if(!v)return;const t=getT(d.id);t.subs.push({id:nid('sub'),title:v,who:'me',due:null,st:'todo',note:'',comments:[]});break}
 case 'comment':{const v=val('cm-'+d.id);if(!v)return;getT(d.id).comments.push({id:nid('c'),u:'me',t:v,ts:Date.now()});requestAnimationFrame(()=>{const s=$app.querySelector('.scroll');if(s)s.scrollTop=s.scrollHeight});break}
 case 'subComment':{const v=val('sc-'+d.sub);if(!v)return;getT(d.id).subs.find(s=>s.id===d.sub).comments.push({id:nid('c'),u:'me',t:v,ts:Date.now()});break}
 case 'addLabel':{const v=val('lbl-in');if(!v)return;const t=getT(d.id);if(!t.labels.includes(v))t.labels.push(v);S.sheet=null;break}
 case 'addStage':{A.createStage(d);break}
 case 'inviteUser':{let v=val('inv-u');if(!v)return;if(!v.startsWith('@'))v='@'+v;if(!/^@[a-z0-9_]{4,32}$/i.test(v)){S.sheet.err='Username має містити від 4 символів: латиниця, цифри, _';break}
  {const b=getB(d.id);const r=S.sheet.invRole||'editor';
   if(b.pending.some(x=>x.u.toLowerCase()===v.toLowerCase())||b.members.some(m=>(U[m.u].un||'').toLowerCase()===v.toLowerCase())){S.sheet.err='Ця людина вже є на дошці або вже має запрошення';break}
   if(window.orviApi){const sh=S.sheet;sh.err=null;sh.busy=true;const inp=document.getElementById('inv-u');orviApi.invite(b.id,v,r).then(res=>{sh.busy=false;
     if(res.ok){b.pending.push(res.pending);sh.lastSent={u:res.pending.u,r};if(inp)inp.value='';toast(`Бот надіслав ${res.pending.u} запрошення: роль «${ROLE[r]}»`)}
     else sh.err=INV_ERR[res.error]||LINK_ERR.network;render()});break}
   S.sheet.err=null;b.pending.push({u:v,r});S.sheet.lastSent={u:v,r};toast(`Бот надіслав ${v} запрошення: роль «${ROLE[r]}»`)}break}
 }render()});
document.addEventListener('input',e=>{const el=e.target;const d=el.dataset;if(!d.bind)return;
 if(d.bind==='title')getT(d.id).title=el.value;
 else if(d.bind==='desc')getT(d.id).desc=el.value;
 else if(d.bind==='subTitle')getT(d.id).subs.find(s=>s.id===d.sub).title=el.value;
 else if(d.bind==='subNote')getT(d.id).subs.find(s=>s.id===d.sub).note=el.value;
 else if(d.bind==='sf'&&S.sheet){S.sheet[d.k]=el.value;if(d.k==='link')S.sheet.res=null}
 else if(d.bind==='q'){S.q[d.t]=el.value;render()}
 else if(d.bind==='iq'&&S.sheet){S.sheet.iq=el.value;render()}});
document.addEventListener('change',e=>{const el=e.target;const d=el.dataset;if(!d.bind)return;
 if(d.bind==='due'){const t=getT(d.id);const old=t.due;t.due=el.value||null;if(old&&old!==t.due)S.cancelled.push(`Нагадування на ${fShort.format(parse(old))} для «${t.title}» скасовано: термін перенесено.`);toast(t.due?`Термін: ${fLong.format(parse(t.due))}. Оновлено на головній і в нагадуваннях`:'Термін прибрано')}
 else if(d.bind==='time')getT(d.id).time=el.value;
 else if(d.bind==='subDue')getT(d.id).subs.find(s=>s.id===d.sub).due=el.value||null;
 else if(d.bind==='subWho'){const s=getT(d.id).subs.find(s=>s.id===d.sub);const old=s.who;s.who=el.value;if(old==='me'&&el.value!=='me')S.cancelled.push(`Нагадування про «${s.title}» скасовано: призначення знято.`);toast(el.value==='me'?'Підзадачу призначено вам':`${U[el.value].f} отримає сповіщення`)}
 else if(d.bind==='bn'){const b=getB(d.id);const [a,k]=d.k.split('.');if(el.value)b.notif[a][k]=el.value}
 else if(d.bind==='quiet'){if(el.value)S.quiet[d.k]=el.value}
 else if(d.bind==='sf'&&d.k==='kind'&&S.sheet)S.sheet.kind=el.value;
 else if(d.bind==='role'&&window.orviApi){const b=getB(d.id);const v=el.value;orviApi.setRole(b.id,d.u,v).then(r=>{if(r.ok){if(v==='remove'){b.members=b.members.filter(m=>m.u!==d.u);toast(`${U[d.u].f} більше не має доступу`)}else{b.members.find(m=>m.u===d.u).r=v;toast(`${U[d.u].f}: роль «${ROLE[v]}»`)}}else toast(LINK_ERR.network);render()});return}
 else if(d.bind==='role'){const b=getB(d.id);if(el.value==='remove'){b.members=b.members.filter(m=>m.u!==d.u);toast(`${U[d.u].f} більше не має доступу`)}else b.members.find(m=>m.u===d.u).r=el.value}
 else if(d.bind==='file'){const f=el.files&&el.files[0];if(f){const t=getT(d.id);const kb=f.size/1024;t.files.push({n:f.name,s:kb>1024?(kb/1024).toFixed(1).replace('.',',')+' МБ':Math.max(1,Math.round(kb))+' КБ'});S.filesOpen[d.id]=true;toast('Файл прикріплено')}}
 else return;render()});

try{const th=localStorage.getItem('orvi-theme');if(th)S.theme=th}catch(e){}
applyTheme();render();
document.querySelector('[data-a=openLib]').innerHTML=ic('shapes','sm')+'Бібліотека іконок · '+ICON_COUNT;
